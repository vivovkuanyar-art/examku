name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Berikan Izin Eksekusi Gradlew
        run: chmod +x gradlew

      - name: Kompilasi APK (Debug)
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamBrowser-APK
          path: app/build/outputs/apk/**/*.apk
